<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE CODERS-AYAN-ASSIGNMENT 16</title>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            text-align: center;
            color: white;
            text-transform: uppercase;
            font-family: Poppins, sans-serif;
        }

        .container {
            display: grid;
            padding: 20px;
            gap: 2px;
            height: 98vh;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(8, 1fr);
        }

        .hr {
            background-color: rgb(3, 20, 57);
            grid-column: span 1;

        }

        .me {
            grid-column: span 3;
            background-color: rgb(255, 0, 153);
        }

        .he {
            grid-column: span 4;
            grid-row: span 4;
            background-color: rgb(0, 98, 245);
        }

        .main {
            grid-row: span 2;
            grid-column: span 2;
            background-color: rgb(6, 23, 109);
        }

        .gap {
            grid-row: span 2;
            grid-column: span 1;
        }

        .im {
            background-color: rgba(53, 220, 254, 0.58);
        }

        .ex {
            background-color: rgba(0, 243, 166, 0.765);
        }

        .ban {
            grid-column: span 4;
            background-color: rgba(255, 242, 0, 0.671);
        }



        @media screen and (max-width:768px) {
            .container {
                height: 100vh;
            }


            .hr {
                order: 1;
                grid-column: span 4;
            }

            .he {
                order: 2;
                grid-column: span 4;
            }

            .gap {
                display: none;
            }

            .me {
                order: 3;
                grid-column: span 1;
                grid-row: span 4;
            }

            .main {
                order: 4;
                grid-column: span 3;
            }

            .ban {
                order: 5;
                grid-column: span 3;
            }

            .im {
                order: 6;
                grid-column: span 2;
                grid-row: span 1;
            }

            .ex {
                grid-row: span 1;
                order: 7;
                grid-column: span 1;
            }
        }



        @media screen and (min-width:250px) and (max-width:568px) {
            .container {
                height: 100vh;
            }

            .hr {
                order: 1;
                padding: 10px;
                grid-column: span 4;
            }

            .he {
                padding: 10px;
                order: 2;
                grid-row: span 1;
                grid-column: span 4;
            }

            .gap {
                display: none;
            }

            .me {
                padding: 10px;
                order: 3;
                grid-column: span 4;
                grid-row: span 1;
            }

            .main {
                order: 4;
                padding: 10px;
                grid-column: span 4;
            }

            .ban {
                order: 5;
                padding: 10px;
                grid-column: span 4;
            }

            .im {
                order: 6;
                padding: 10px;
                grid-column: span 4;
                grid-row: span 1;
            }

            .ex {
                grid-row: span 1;
                padding: 10px;
                order: 7;
                grid-column: span 4;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hr">HEADER</div>
        <div class="me">MENU</div>
        <div class="he">HERO</div>
        <div class="main">MAIN</div>
        <div class="gap"></div>
        <div class="im">IMAGE</div>
        <div class="ex">EXTRA</div>
        <div class="ban">BANNER</div>

    </div>
</body>

</html>
