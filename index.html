<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE CODERS-AYAN-ASSIGNMENT 16</title>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            text-align: center;
            color: white;
            text-transform: uppercase;
            font-family: Poppins, sans-serif;
        }

        .head {
            background-color: #030b2e;
            width: 100%;
            padding: 10px;
        }

        .menu {
            background-color: tomato;
            padding: 10px;
            width: 100%;
        }

        .container {
            padding: 10px;
        }

        .header {

            display: grid;
            gap: 5px;
            grid-template-columns: 1fr 3fr;
            background-color: #f2f2f2;
        }

        .hero {
            width: 100%;
            margin: 5px 0;
            background-color: #386edb;
            padding: 140px;

        }

        .content {
            display: grid;
            grid-template-rows: 2fr 1fr;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
        }

        .main {

            background-color: #041149;
            padding: 20px;
        }

        .image {
            background-color: #a2ef7f;
            padding: 20px;
        }

        .gap {
            background-color: #f2f2f2;
        }

        .extra {
            background-color: #057565;
            padding: 20px;
        }

        .ie {
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
        }


        .footer {
            width: 100%;
            margin-top: -55px;
            background-color: #808080;
            padding: 25px;
        }



        @media screen and (max-width: 768px) and (min-width: 601px) {
            .container {
                display: grid;
                grid-template-columns: 1fr;
                gap: 0;
            }

            .header {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .head {
                grid-area: header;
                width: 768px;
                text-align: center;
                padding: 10px 49% 10px 45%;
            }

            .ie {
                order: 10;
            }

            .menu {
                grid-area: menu;
                position: absolute;
                top: 267px;
                width: 191px;
                padding: 154px 12px;
            }

            .hero {
                margin: 0;
                padding: 100px 10px;
                grid-area: hero;
            }

            .content {
                display: grid;
                grid-template-columns: 1fr 3fr;
                grid-template-rows: auto auto;
                gap: 0;
                grid-area: content;
            }

            .main {
                grid-column: 2;
                grid-row: 1;
                padding: 80px 20px;
            }

            .gap {
                display: none;
            }

            .ie {
                grid-column: 2;
                grid-row: 2;
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 0;
            }

            .image,
            .extra {
                padding: 25px 10px;
            }

            .footer {
                grid-area: footer;
                margin: 0;
                padding: 30px 10px;
            }

            .container {
                grid-template-areas:
                    "header"
                    "hero"
                    "content"
                    "footer";
            }

            .header {
                display: grid;
                grid-template-columns: 1fr;
            }

            .content {
                grid-template-areas:
                    "menu main"
                    "menu ie";
                grid-template-columns: 1fr 3fr;
            }

            .menu {
                grid-column: 1;
                grid-row: 1 / 2;
            }
        }


        @media screen and (max-width:600px) {
            .header {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 50px 10px;
                order: 1;
            }

            .main {
                padding: 50px 10px;
                order: 2;
            }

            .content {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr;
            }

            .gap {
                display: none;
            }

            .ie {
                order: 4;

            }

            .ie .extra {
                order: 2;
            }

            .footer {
                margin: 5px 0px 0px 0px;
                order: 2;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="head">Header</div>
            <div class="menu">Menu</div>
        </div>


        <div class="hero">Hero</div>
        <div class="content">
            <div class="main">Main</div>
            <div class="gap"></div>
            <div class="ie">
                <div class="image">
                    Image
                </div>
                <div class="extra">EXTRA</div>
            </div>
        </div>
        <div class="footer">Banner</div>

    </div>
</body>

</html>
